name: C Trader monorepo web and Android build

on:
  push:
    branches: [master, main, "feature/c-trader-app"]
    paths:
      - "backend/**"
      - "frontend-web/**"
      - "mobile-app/**"
      - "matching-engine/**"
      - "docs/**"
      - "README-C-TRADER.md"
      - "docker-compose.yml"
      - ".github/workflows/c-trader-build.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend-web/**"
      - "mobile-app/**"
      - "matching-engine/**"
      - "docs/**"
      - "README-C-TRADER.md"
      - "docker-compose.yml"
      - ".github/workflows/c-trader-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c-trader-monorepo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout C Trader modules only
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            backend
            frontend-web
            mobile-app
            matching-engine
            docs
            README-C-TRADER.md
            docker-compose.yml
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Validate paper engine
        run: go build -o /tmp/c-trader-paper-engine matching-engine/src/main.go
      - name: Install backend dependencies
        working-directory: backend
        run: npm install
      - name: Check backend JavaScript syntax
        working-directory: backend
        run: npm run check
      - name: Install web dependencies
        working-directory: frontend-web
        run: npm install
      - name: Build web app
        working-directory: frontend-web
        run: npm run build
      - name: Install mobile dependencies
        working-directory: mobile-app
        run: npm install
      - name: Generate Android project
        working-directory: mobile-app
        run: npx cap add android
      - name: Configure native Firebase Gradle dependencies
        working-directory: mobile-app/android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("build.gradle")
          app = Path("app/build.gradle")
          if not root.exists() or not app.exists():
              raise SystemExit("Expected Capacitor-generated Groovy Gradle files were not found")

          root_text = root.read_text()
          plugin_line = "id 'com.google.gms.google-services' version '4.5.0' apply false"
          if "com.google.gms.google-services" not in root_text:
              if re.search(r"(?m)^plugins\\s*\\{", root_text):
                  root_text = re.sub(r"(?m)^(plugins\\s*\\{)", r"\\1\\n    " + plugin_line, root_text, count=1)
              else:
                  raise SystemExit("Root Gradle plugins block not found; refusing to guess the Gradle structure")
              root.write_text(root_text)

          app_text = app.read_text()
          if "com.google.firebase:firebase-bom" not in app_text:
              dep_block = re.search(r"(?s)dependencies\\s*\\{", app_text)
              if not dep_block:
                  raise SystemExit("App Gradle dependencies block not found")
              additions = """
              implementation platform('com.google.firebase:firebase-bom:35.0.2')
              implementation 'com.google.firebase:firebase-auth'
              implementation 'com.google.firebase:firebase-firestore'
              """
              app_text = app_text[:dep_block.end()] + additions + app_text[dep_block.end():]

          # Apply the Google Services plugin only when the real project config is supplied.
          # This keeps CI/builds working without inventing Firebase project credentials.
          if "com.google.gms.google-services" not in app_text:
              marker = "apply plugin: 'com.android.application'"
              if marker in app_text:
                  app_text = app_text.replace(
                      marker,
                      marker + "\\nif (file('google-services.json').exists()) {\\n    apply plugin: 'com.google.gms.google-services'\\n}",
                      1
                  )
              else:
                  plugins = re.search(r"(?m)^plugins\\s*\\{", app_text)
                  if not plugins:
                      raise SystemExit("App Gradle plugin declaration not found")
                  app_text = re.sub(
                      r"(?m)^(plugins\\s*\\{)",
                      r"\\1\\n    id 'com.google.gms.google-services' apply false",
                      app_text,
                      count=1
                  )
                  app_text += "\\nif (file('google-services.json').exists()) { apply plugin: 'com.google.gms.google-services' }\\n"
          app.write_text(app_text)
          PY
      - name: Sync web assets into Android
        working-directory: mobile-app
        run: npx cap sync android
      - name: Build debug APK
        working-directory: mobile-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Verify APK exists
        run: test -s mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: c-trader-debug-apk
          path: mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: c-trader-web-dist
          path: frontend-web/dist/
          if-no-files-found: error
          retention-days: 14
