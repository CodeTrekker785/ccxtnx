name: C Trader monorepo web and Android build

on:
  push:
    branches: [master, main, "feature/c-trader-app"]
    paths:
      - "backend/**"
      - "frontend-web/**"
      - "mobile-app/**"
      - "matching-engine/**"
      - "docs/**"
      - "README-C-TRADER.md"
      - "docker-compose.yml"
      - ".github/workflows/c-trader-build.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend-web/**"
      - "mobile-app/**"
      - "matching-engine/**"
      - "docs/**"
      - "README-C-TRADER.md"
      - "docker-compose.yml"
      - ".github/workflows/c-trader-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c-trader-monorepo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout C Trader modules only
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            backend
            frontend-web
            mobile-app
            matching-engine
            docs
            README-C-TRADER.md
            docker-compose.yml
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install backend dependencies
        working-directory: backend
        run: npm install
      - name: Check backend JavaScript syntax
        working-directory: backend
        run: npm run check
      - name: Install web dependencies
        working-directory: frontend-web
        run: npm install
      - name: Build web app
        working-directory: frontend-web
        run: npm run build
      - name: Install mobile dependencies
        working-directory: mobile-app
        run: npm install
      - name: Generate Android project
        working-directory: mobile-app
        run: npx cap add android
      - name: Sync web assets into Android
        working-directory: mobile-app
        run: npx cap sync android
      - name: Build debug APK
        working-directory: mobile-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Verify APK exists
        run: test -s mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: c-trader-debug-apk
          path: mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: c-trader-web-dist
          path: frontend-web/dist/
          if-no-files-found: error
          retention-days: 14
